<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=DM+Mono:wght@400;500&display=block">
<style>
body{margin:0;padding:40px;background:#ddd;font-family:'Bricolage Grotesque'}
.sheet{width:2000px;padding:60px;background:#F3EFE9;display:grid;grid-template-columns:repeat(4,1fr);gap:40px}
.t{height:380px;border-radius:40px;display:grid;place-items:center;position:relative}
.t span{position:absolute;bottom:16px;left:20px;font:14px 'DM Mono';opacity:.6}
.row{grid-column:1/-1;display:flex;gap:40px;align-items:center;font-size:150px;font-weight:800;letter-spacing:-.05em;color:#121318}
.small{display:flex;gap:30px;align-items:center}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070B1F"/><stop offset=".55" stop-color="#1B2A6B"/><stop offset="1" stop-color="#7F9BFF"/></linearGradient>
  <linearGradient id="light" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#C8D4FF"/><stop offset="1" stop-color="#8FA8FF"/></linearGradient>
  <!-- pebble with wraparound shades -->
  <symbol id="peb" viewBox="0 0 120 120">
    <path d="M60 8 C81 8 99 35 99 66 C99 96 81 113 60 113 C39 113 21 96 21 66 C21 35 39 8 60 8 Z" fill="var(--body)"/>
    <path d="M14 47 C30 41 90 41 106 47" fill="none" stroke="var(--frame)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M24 46 L57 46 C58 46 58.5 47 58 48.5 L55.5 60 C54 67 49 71 42 71 L33 71 C26 71 22 66 22.5 58 L23 49 C23 47 23.5 46 24 46 Z" fill="var(--lens)"/>
    <path d="M96 46 L63 46 C62 46 61.5 47 62 48.5 L64.5 60 C66 67 71 71 78 71 L87 71 C94 71 98 66 97.5 58 L97 49 C97 47 96.5 46 96 46 Z" fill="var(--lens)"/>
  </symbol>
  <!-- glasses only -->
  <symbol id="gl" viewBox="0 0 120 120">
    <path d="M10 44 C30 38 90 38 110 44" fill="none" stroke="var(--frame)" stroke-width="5" stroke-linecap="round"/>
    <path d="M18 43 L56 43 C57.5 43 58.2 44.4 57.8 46 L54.5 62 C52.8 71 47 76 38 76 L29 76 C20 76 15.5 70 16 61 L16.6 46 C16.8 44 17.3 43 18 43 Z" fill="var(--lens)"/>
    <path d="M102 43 L64 43 C62.5 43 61.8 44.4 62.2 46 L65.5 62 C67.2 71 73 76 82 76 L91 76 C100 76 104.5 70 104 61 L103.4 46 C103.2 44 102.7 43 102 43 Z" fill="var(--lens)"/>
  </symbol>
</defs></svg>
<div class="sheet" data-out="c-marks">
  <div class="t" style="background:#fff;--body:#121318;--frame:#B9C0CC;--lens:url(#light)"><svg width="260" height="260"><use href="#peb"/></svg><span>1 · ink pebble, mirror lenses</span></div>
  <div class="t" style="background:#1B2A6B;--body:#F3EFE9;--frame:#C9CDD6;--lens:url(#dark)"><svg width="260" height="260"><use href="#peb"/></svg><span>2 · cream pebble on cobalt</span></div>
  <div class="t" style="background:#F3EFE9;border:1px solid #e2ded4;--body:#FFFFFF;--frame:#9AA1AE;--lens:url(#dark)"><svg width="260" height="260"><use href="#peb"/></svg><span>3 · white pebble on paper</span></div>
  <div class="t" style="background:#0B1230;--body:transparent;--frame:#fff;--lens:url(#light)"><svg width="260" height="260"><use href="#gl"/></svg><span>4 · glasses only</span></div>
  <div class="row"><svg width="170" height="170" style="--body:#121318;--frame:#B9C0CC;--lens:url(#light)"><use href="#peb"/></svg>tint</div>
  <div class="row small" style="font-size:40px">
    <div style="width:48px;height:48px;border-radius:50%;background:#1B2A6B;display:grid;place-items:center;--body:#F3EFE9;--frame:#C9CDD6;--lens:url(#dark)"><svg width="40" height="40"><use href="#peb"/></svg></div>
    <svg width="40" height="40" style="--body:#121318;--frame:#B9C0CC;--lens:url(#light)"><use href="#peb"/></svg>
    <svg width="24" height="24" style="--body:#121318;--frame:#B9C0CC;--lens:url(#light)"><use href="#peb"/></svg>
    <svg width="16" height="16" style="--body:#121318;--frame:#B9C0CC;--lens:url(#light)"><use href="#peb"/></svg>
    <span style="font-size:20px;font-family:'DM Mono';opacity:.6">48 · 40 · 24 · 16 px</span>
  </div>
</div>
</body></html>
